name: Update HPAI detections
on:
  schedule:
    - cron: "10 11 * * *"   # 6:10 am Eastern (EST) / 7:10 am (EDT)
    - cron: "10 22 * * *"   # 5:10 pm Eastern (EST) / 6:10 pm (EDT)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch official sources and rebuild data/detections.json
        run: python tools/update_detections.py
      - name: Send email alerts (only if the alert secrets are set)
        env:
          ARCGIS_PORTAL: ${{ secrets.ARCGIS_PORTAL }}
          ARCGIS_USER: ${{ secrets.ARCGIS_USER }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
          ALERTS_LAYER: ${{ secrets.ALERTS_LAYER }}
          AREAS_LAYER: ${{ secrets.AREAS_LAYER }}
          DECL_LAYER: ${{ secrets.DECL_LAYER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python tools/send_alerts.py
      - name: Commit if changed
        run: |
          git config user.name "hpai-data-bot"
          git config user.email "hpai-data-bot@users.noreply.github.com"
          git add data/detections.json data/alerts_state.json 2>/dev/null || git add data/detections.json
          git diff --cached --quiet || (git commit -m "Update HPAI detections $(date -u +%F\ %H:%M) UTC" && git push)
